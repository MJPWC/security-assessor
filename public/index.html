<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Package Security Assessor</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f1f1f;
        --muted: #5f5a55;
        --line: #ded8d2;
        --panel: #f7f4f0;
        --panel-strong: #efe7df;
        --accent: #eb8c00;
        --accent-dark: #d04a02;
        --red: #e0301e;
        --burgundy: #a32020;
        --charcoal: #2d2d2d;
        --ok: #2f6b3f;
        --warn: #d04a02;
        --bad: #a32020;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #ffffff 0%, #faf7f3 100%);
      }
      header {
        padding: 0;
        border-bottom: 1px solid #cfc6bd;
        background: var(--charcoal);
        color: #fff;
      }
      .brand-strip {
        display: grid;
        grid-template-columns: 44px 30px 36px 54px minmax(0, 1fr);
        height: 10px;
      }
      .brand-strip span:nth-child(1) { background: var(--burgundy); }
      .brand-strip span:nth-child(2) { background: var(--red); }
      .brand-strip span:nth-child(3) { background: var(--accent-dark); }
      .brand-strip span:nth-child(4) { background: var(--accent); }
      .brand-strip span:nth-child(5) { background: #4a4a4a; }
      .header-inner {
        padding: 22px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 720;
        letter-spacing: 0;
      }
      .subtitle {
        margin: 3px 0 0;
        color: #d8d2cc;
        font-size: 13px;
      }
      main {
        padding: 24px 28px 34px;
        display: grid;
        grid-template-columns: minmax(280px, 380px) minmax(0, 1fr);
        gap: 24px;
      }
      section {
        min-width: 0;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
        padding: 20px;
        box-shadow: 0 1px 0 rgba(31, 31, 31, 0.05);
      }
      .stack { display: grid; gap: 14px; }
      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .field-full {
        grid-column: 1 / -1;
      }
      .hint {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 650;
        margin-bottom: 8px;
      }
      input[type="file"] {
        width: 100%;
        padding: 12px;
        border: 1px dashed #b8ada2;
        border-radius: 4px;
        background: var(--panel);
      }
      input[type="text"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
        color: var(--ink);
        padding: 9px 10px;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.4;
      }
      textarea {
        min-height: 76px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 4px;
        background: var(--accent-dark);
        color: #fff;
        padding: 11px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--burgundy);
      }
      button:disabled {
        opacity: 0.58;
        cursor: not-allowed;
      }
      .status {
        min-height: 42px;
        border-radius: 4px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
        padding: 11px 12px;
        color: var(--muted);
        font-size: 14px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .metric {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 12px;
        background: #fff;
        border-top: 4px solid var(--accent);
      }
      .metric:nth-child(1) { border-top-color: var(--burgundy); }
      .metric:nth-child(2) { border-top-color: var(--red); }
      .metric:nth-child(3) { border-top-color: var(--accent-dark); }
      .metric:nth-child(4) { border-top-color: var(--accent); }
      .metric b {
        display: block;
        font-size: 22px;
        line-height: 1;
      }
      .metric span {
        color: var(--muted);
        font-size: 12px;
      }
      .decision {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid #6a625c;
        background: #3a3a3a;
        color: #f7f4f0;
        font-weight: 720;
      }
      .decision.approved { color: var(--ok); }
      .decision.conditional { color: var(--warn); }
      .decision.blocked { color: var(--bad); }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #0f1720;
        color: #e8edf5;
        border-radius: 4px;
        border-top: 5px solid var(--accent-dark);
        padding: 16px;
        max-height: 68vh;
        overflow: auto;
      }
      .report-view {
        display: grid;
        gap: 14px;
      }
      .report-empty {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
        color: var(--muted);
        padding: 18px;
      }
      .report-card {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
        overflow: hidden;
      }
      .report-card h2 {
        margin: 0;
        padding: 11px 13px;
        background: var(--charcoal);
        color: #fff;
        font-size: 14px;
        letter-spacing: 0;
      }
      .report-card .card-body {
        padding: 13px;
      }
      .kv {
        display: grid;
        grid-template-columns: minmax(120px, 180px) minmax(0, 1fr);
        gap: 8px 12px;
        font-size: 13px;
      }
      .kv dt {
        color: var(--muted);
        font-weight: 700;
      }
      .kv dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        background: var(--panel);
        color: var(--ink);
        text-align: left;
        font-weight: 750;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 9px 10px;
        vertical-align: top;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--panel);
        font-size: 12px;
        font-weight: 750;
      }
      .pill.pass { color: var(--ok); }
      .pill.fail,
      .pill.critical,
      .pill.high { color: var(--bad); }
      .pill.medium { color: var(--warn); }
      .pill.low,
      .pill.info { color: var(--muted); }
      a {
        color: var(--accent);
        font-weight: 650;
      }
      .links {
        display: grid;
        gap: 8px;
        font-size: 14px;
      }
      .links a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 38px;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent-dark);
        border-radius: 4px;
        background: #fff;
        color: var(--ink);
        text-decoration: none;
      }
      .links a:hover {
        border-left-color: var(--burgundy);
        background: var(--panel);
      }
      .links a::after {
        content: "Download";
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 720;
      }
      @media (max-width: 860px) {
        main { grid-template-columns: 1fr; padding: 18px; }
        .header-inner { padding: 18px; align-items: flex-start; flex-direction: column; }
        .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .field-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand-strip" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="header-inner">
        <div class="brand">
          <div>
            <h1>Package Security Assessor</h1>
            <p class="subtitle">Pre-deployment artifact review</p>
          </div>
        </div>
        <div class="decision" id="decision">No assessment yet</div>
      </div>
    </header>
    <main>
      <section class="panel stack">
        <div>
          <label for="artifact">Upload application package</label>
          <input id="artifact" type="file" accept=".jar,.war,.zip,.tgz,.tar,.gz,.whl,.py,.js,.json">
        </div>
        <button id="scan">Run Security Assessment</button>
        <div class="status" id="status">Select a Node.js, Python, JAR, WAR, ZIP, TAR, TGZ, or wheel package.</div>
        <div class="summary">
          <div class="metric"><b id="critical">0</b><span>Critical</span></div>
          <div class="metric"><b id="high">0</b><span>High</span></div>
          <div class="metric"><b id="medium">0</b><span>Medium</span></div>
          <div class="metric"><b id="low">0</b><span>Low</span></div>
        </div>
        <div class="links" id="links"></div>
        <hr style="width:100%; border:0; border-top:1px solid var(--line);">
        <div class="field-grid">
          <div class="field-full">
            <label for="target-url">Running app URL</label>
            <input id="target-url" type="text" placeholder="http://16.16.70.70:5001">
          </div>
          <div>
            <label for="guardrail-endpoint">Prompt endpoint</label>
            <input id="guardrail-endpoint" type="text" value="/api/process">
          </div>
          <div>
            <label for="guardrail-method">Method</label>
            <select id="guardrail-method">
              <option>POST</option>
              <option>PUT</option>
            </select>
          </div>
          <div class="field-full">
            <label for="guardrail-body">Request body template</label>
            <textarea id="guardrail-body">{"input":"{{prompt}}","apiName":"SecurityGuardrailTest","saveFiles":false}</textarea>
            <div class="hint">Use {{prompt}} where the restricted prompt should be inserted.</div>
          </div>
          <div class="field-full">
            <label for="guardrail-headers">Headers</label>
            <textarea id="guardrail-headers" placeholder="Authorization: Bearer token"></textarea>
          </div>
          <div class="field-full">
            <label for="guardrail-signals">Expected block signals</label>
            <textarea id="guardrail-signals">blocked
warning
not allowed
restricted
policy
cannot comply</textarea>
          </div>
        </div>
        <button id="guardrail-scan">Run Restricted Prompt Test</button>
        <div class="links" id="guardrail-links"></div>
      </section>
      <section class="stack">
        <div id="report" class="report-view">
          <div class="report-empty">Assessment report will appear here after the scan completes.</div>
        </div>
      </section>
    </main>
    <script>
      const fileInput = document.getElementById('artifact');
      const scanButton = document.getElementById('scan');
      const statusEl = document.getElementById('status');
      const reportEl = document.getElementById('report');
      const linksEl = document.getElementById('links');
      const guardrailLinksEl = document.getElementById('guardrail-links');
      const decisionEl = document.getElementById('decision');
      const guardrailButton = document.getElementById('guardrail-scan');
      const guardrailFields = {
        targetUrl: document.getElementById('target-url'),
        endpoint: document.getElementById('guardrail-endpoint'),
        method: document.getElementById('guardrail-method'),
        bodyTemplate: document.getElementById('guardrail-body'),
        headers: document.getElementById('guardrail-headers'),
        expectedSignals: document.getElementById('guardrail-signals')
      };
      const counters = {
        critical: document.getElementById('critical'),
        high: document.getElementById('high'),
        medium: document.getElementById('medium'),
        low: document.getElementById('low')
      };

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function setDecision(value) {
        decisionEl.textContent = value || 'No assessment yet';
        decisionEl.className = 'decision';
        const lower = String(value || '').toLowerCase();
        if (lower.includes('approved') && !lower.includes('conditional')) decisionEl.classList.add('approved');
        if (lower.includes('conditional')) decisionEl.classList.add('conditional');
        if (lower.includes('blocked')) decisionEl.classList.add('blocked');
      }

      function arrayBufferToBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        const chunkSize = 0x8000;
        let binary = '';
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary);
      }

      function renderLinks(runId) {
        if (!runId) {
          linksEl.innerHTML = '';
          return;
        }
        linksEl.innerHTML = [
          `<a href="/api/reports/${runId}/report.xlsx" download="security-assessment-${runId}.xlsx">Excel report</a>`,
          `<a href="/api/reports/${runId}/report.md" download="security-assessment-${runId}.md">Markdown report</a>`,
          `<a href="/api/reports/${runId}/report.json" download="security-assessment-${runId}.json">JSON report</a>`,
          `<a href="/api/reports/${runId}/sbom.json" download="security-assessment-sbom-${runId}.json">SBOM</a>`
        ].join('');
      }

      function renderGuardrailLinks(runId) {
        if (!runId) {
          guardrailLinksEl.innerHTML = '';
          return;
        }
        guardrailLinksEl.innerHTML = [
          `<a href="/api/reports/${runId}/guardrail-report.xlsx" download="guardrail-test-${runId}.xlsx">Guardrail Excel</a>`,
          `<a href="/api/reports/${runId}/guardrail-report.md" download="guardrail-test-${runId}.md">Guardrail Markdown</a>`,
          `<a href="/api/reports/${runId}/guardrail-report.json" download="guardrail-test-${runId}.json">Guardrail JSON</a>`
        ].join('');
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));
      }

      function pill(value, extra = '') {
        return `<span class="pill ${extra || String(value || '').toLowerCase()}">${escapeHtml(value)}</span>`;
      }

      function renderTable(headers, rows, emptyText) {
        if (!rows || rows.length === 0) return `<div class="card-body">${escapeHtml(emptyText)}</div>`;
        return `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
      }

      function renderReport(payload) {
        const counts = payload.findingCounts || {};
        const findings = payload.findings || [];
        const certificateScan = payload.certificateScan || {};
        const certificateFiles = certificateScan.certificateFiles || [];
        const components = payload.components || [];
        const findingRows = findings.map(item => `
          <tr>
            <td>${pill(item.severity, item.severity)}</td>
            <td>${escapeHtml(item.task)}</td>
            <td>${escapeHtml(item.details)}</td>
          </tr>`);
        const componentRows = components.slice(0, 25).map(item => `
          <tr>
            <td>${escapeHtml(item.ecosystem)}</td>
            <td>${escapeHtml(item.name)}</td>
            <td>${escapeHtml(item.version)}</td>
          </tr>`);
        const certificateRows = certificateFiles.map(item => `
          <tr>
            <td>${escapeHtml(item.file)}</td>
            <td>${escapeHtml(item.type)}</td>
            <td>${pill(item.parsed ? 'Parsed' : 'Review', item.parsed ? 'pass' : 'medium')}</td>
            <td>${escapeHtml(item.subject || item.error || '')}</td>
            <td>${escapeHtml(item.notAfter || '')}</td>
          </tr>`);
        reportEl.innerHTML = `
          <section class="report-card">
            <h2>Assessment Summary</h2>
            <div class="card-body">
              <dl class="kv">
                <dt>Run ID</dt><dd>${escapeHtml(payload.runId)}</dd>
                <dt>Decision</dt><dd>${pill(payload.decision || 'Unknown')}</dd>
                <dt>Components</dt><dd>${escapeHtml(payload.componentCount || 0)}</dd>
                <dt>Findings</dt><dd>Critical ${counts.critical || 0} · High ${counts.high || 0} · Medium ${counts.medium || 0} · Low ${counts.low || 0}</dd>
                <dt>Certificates</dt><dd>${certificateFiles.length}</dd>
              </dl>
            </div>
          </section>
          <section class="report-card">
            <h2>Findings</h2>
            ${renderTable(['Severity', 'Task', 'Details'], findingRows, 'No findings were reported.')}
          </section>
          <section class="report-card">
            <h2>Certificate and TLS Security</h2>
            ${renderTable(['File', 'Type', 'Status', 'Subject / Error', 'Not After'], certificateRows, 'No certificate, keystore, or private key was found.')}
          </section>
          <section class="report-card">
            <h2>Dependency Sample</h2>
            ${renderTable(['Ecosystem', 'Name', 'Version'], componentRows, 'No dependency components were found.')}
          </section>
        `;
      }

      function renderGuardrailReport(payload) {
        const summary = payload.summary || {};
        const rows = (payload.tests || []).map(item => `
          <tr>
            <td>${escapeHtml(item.name)}</td>
            <td>${pill(item.severity, item.severity)}</td>
            <td>${pill(item.result, item.result === 'blocked' ? 'pass' : item.result === 'failed' ? 'fail' : 'medium')}</td>
            <td>${escapeHtml(item.status || '')}</td>
            <td>${escapeHtml(item.reason || '')}</td>
          </tr>`);
        reportEl.innerHTML = `
          <section class="report-card">
            <h2>Restricted Prompt Test Summary</h2>
            <div class="card-body">
              <dl class="kv">
                <dt>Run ID</dt><dd>${escapeHtml(payload.runId)}</dd>
                <dt>Decision</dt><dd>${pill(payload.decision || 'Unknown', summary.failed ? 'fail' : summary.warnings ? 'medium' : 'pass')}</dd>
                <dt>Total prompts</dt><dd>${escapeHtml(summary.total || 0)}</dd>
                <dt>Blocked</dt><dd>${escapeHtml(summary.blocked || 0)}</dd>
                <dt>Failed</dt><dd>${escapeHtml(summary.failed || 0)}</dd>
                <dt>Warnings</dt><dd>${escapeHtml(summary.warnings || 0)}</dd>
              </dl>
            </div>
          </section>
          <section class="report-card">
            <h2>Prompt Results</h2>
            ${renderTable(['Prompt', 'Severity', 'Result', 'HTTP', 'Reason'], rows, 'No prompt tests were executed.')}
          </section>
        `;
      }

      scanButton.addEventListener('click', async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) {
          setStatus('Please select a package first.');
          return;
        }
        scanButton.disabled = true;
        reportEl.innerHTML = '<div class="report-empty">Scanning package...</div>';
        renderLinks();
        setDecision('Running');
        Object.values(counters).forEach(el => { el.textContent = '0'; });
        try {
          setStatus('Reading upload in browser...');
          const contentBase64 = arrayBufferToBase64(await file.arrayBuffer());
          setStatus('Uploading and running checks...');
          const response = await fetch('/api/assess', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fileName: file.name, contentBase64 })
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || 'Assessment failed.');
          setDecision(payload.decision);
          for (const key of Object.keys(counters)) {
            counters[key].textContent = payload.findingCounts?.[key] || 0;
          }
          renderReport(payload);
          renderLinks(payload.runId);
          setStatus(`Completed run ${payload.runId}. Components found: ${payload.componentCount}.`);
        } catch (error) {
          setDecision('Failed');
          reportEl.innerHTML = `<div class="report-empty">${escapeHtml(error.message)}</div>`;
          setStatus('Assessment failed. Check the selected package and try again.');
        } finally {
          scanButton.disabled = false;
        }
      });

      guardrailButton.addEventListener('click', async () => {
        const targetUrl = guardrailFields.targetUrl.value.trim();
        if (!targetUrl) {
          setStatus('Please enter the running app URL first.');
          return;
        }
        guardrailButton.disabled = true;
        reportEl.innerHTML = '<div class="report-empty">Running restricted prompt tests...</div>';
        renderGuardrailLinks();
        setDecision('Running');
        try {
          setStatus('Sending restricted prompts to running app...');
          const response = await fetch('/api/guardrail-test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              targetUrl,
              endpoint: guardrailFields.endpoint.value.trim(),
              method: guardrailFields.method.value,
              bodyTemplate: guardrailFields.bodyTemplate.value,
              headers: guardrailFields.headers.value,
              expectedSignals: guardrailFields.expectedSignals.value
            })
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error || 'Restricted prompt test failed.');
          setDecision(payload.decision);
          renderGuardrailReport(payload);
          renderGuardrailLinks(payload.runId);
          setStatus(`Completed restricted prompt run ${payload.runId}. Failed prompts: ${payload.summary?.failed || 0}.`);
        } catch (error) {
          setDecision('Failed');
          reportEl.innerHTML = `<div class="report-empty">${escapeHtml(error.message)}</div>`;
          setStatus('Restricted prompt test failed. Check target URL, endpoint, and request body.');
        } finally {
          guardrailButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
